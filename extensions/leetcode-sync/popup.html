<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PrepYard sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Sync your solved history</h1>
      <p>Keep signed-in LeetCode and PrepYard tabs open in this browser.</p>
      <form id="connect-form">
        <label for="origin">Your PrepYard site address</label
        ><input
          id="origin"
          type="url"
          required
          placeholder="http://localhost:3000"
          autocomplete="off"
        /><button id="connect" type="submit">
          Connect &amp; sync all history
        </button>
      </form>
      <div id="connection" hidden>
        <p id="profile"></p>
        <button id="sync" type="button">Sync now</button
        ><button id="disconnect" class="secondary" type="button">
          Disconnect extension
        </button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="meta">
        Checks every two minutes while both tabs are open. Sends only your
        username and solved question slugs. No passwords, cookies, or solution
        code.
      </p>
    </main>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
